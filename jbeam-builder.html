<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JBeam Builder</title>
<style>
:root{
  --bg:#111318;--panel:#171a20;--panel-2:#1e2229;--panel-3:#252a33;
  --line:#272c35;--line-2:#363c48;--text:#d8dce4;--muted:#8c93a3;--dim:#5d6474;
  --accent:#ff8a1f;--accent-2:#ffb26b;--accent-bg:rgba(255,138,31,.14);
  --ok:#3ecf8e;--warn:#f5c451;--err:#ef5b5b;
  --x:#e5534b;--y:#57c47a;--z:#4f8ff7;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:12px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:268px minmax(0,1fr) 308px;grid-template-rows:42px minmax(0,1fr);height:100vh}
button{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--line-2);border-radius:6px;padding:4px 9px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--panel-3);border-color:#4a5160}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#1d1204;font-weight:600}
button.primary:hover{background:#ff9a3c}
button.danger:hover{border-color:var(--err);color:var(--err)}
button.icon{padding:0 6px;min-width:22px;height:22px;line-height:20px;background:transparent;border-color:transparent;color:var(--muted)}
button.icon:hover{background:var(--panel-3);border-color:var(--line-2);color:var(--text)}
input,select,textarea{font:inherit;color:var(--text);background:#101216;border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent);margin:0}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
kbd{font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 4px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:#14171c}
.muted{color:var(--muted)}.small{font-size:11px}
a{color:var(--accent-2)}

/* top bar */
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px;letter-spacing:.01em;margin-right:6px}
.brand svg{width:20px;height:20px;color:var(--accent)}
.sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.spacer{flex:1}

/* side panels */
#left,#right{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.section{padding:10px 12px;border-bottom:1px solid var(--line)}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
.mode{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;border-radius:7px}
.mode svg{width:20px;height:20px;fill:currentColor}
.mode span{font-size:11px}
.mode kbd{font-size:9px;padding:1px 3px}
.mode.active{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-2)}
.row{display:grid;grid-template-columns:100px minmax(0,1fr);align-items:center;gap:6px;margin-bottom:5px}
.row.top{align-items:start}
.row>label{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair{display:grid;grid-template-columns:1fr 52px;gap:4px}
.check{display:flex;align-items:center;gap:7px;margin:6px 0;color:var(--text);cursor:pointer}
.hint{color:var(--muted);margin:8px 0 0;font-size:11px;line-height:1.55}
.hint b{color:var(--text);font-weight:600}
.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.xyz label{position:relative;display:block}
.xyz label span{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;pointer-events:none}
.xyz label:nth-child(1) span{color:var(--x)}.xyz label:nth-child(2) span{color:var(--y)}.xyz label:nth-child(3) span{color:var(--z)}
.xyz input{padding-left:17px}
.btnrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
button.wide{width:100%;margin-top:6px}

/* tabs & lists */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;border:0;border-radius:0;background:none;padding:8px 2px 7px;color:var(--muted);border-bottom:2px solid transparent}
.tab:hover{background:none;color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab .count{color:var(--dim);font-size:10px;margin-left:2px}
.filter{padding:8px 10px 6px;flex:none}
#gnew-row{display:flex;gap:4px;padding:0 10px 6px;flex:none}
#gnew-row button{flex:none}
.list{flex:1;overflow:auto;padding-bottom:10px;min-height:0}
.item,.gitem{display:flex;align-items:center;gap:7px;padding:3px 12px;cursor:pointer;white-space:nowrap;min-height:23px}
.item:hover,.gitem:hover{background:#1f232b}
.item.sel{background:var(--accent-bg);color:#ffd8b3}
.item .nm,.gitem .nm{overflow:hidden;text-overflow:ellipsis}
.item .sub,.gitem .sub{color:var(--dim);margin-left:auto;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding-left:6px}
.badge{font-size:9px;padding:0 4px;border-radius:3px;background:#2a2f39;color:var(--muted);flex:none}
.gitem .sw{width:10px;height:10px;border-radius:3px;flex:none}
.gbtns{display:flex;gap:0;flex:none}
.empty,.more{color:var(--dim);padding:12px;text-align:center}
.kind{display:inline-block;flex:none}
.kind.n{width:8px;height:8px;border-radius:50%;background:#4fc3f7}
.kind.b{width:11px;height:3px;border-radius:2px;background:#9fb0c8}
.kind.t{width:9px;height:8px;background:#3ecf8e;clip-path:polygon(50% 0,100% 100%,0 100%)}

/* right panel */
.panel-body{flex:1;overflow:auto;min-height:0}
.psec{padding:10px 12px 12px;border-bottom:1px solid var(--line)}
.psec h3{display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--text);font-weight:500}
.psec h3 b{font-weight:650}
.psec h3 .muted{margin-left:auto;font-weight:400;font-size:11px}
.psec h3.caps{text-transform:uppercase;letter-spacing:.07em;font-size:11px;color:var(--muted);font-weight:600}
.sub-h{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 2px 1px 7px;border-radius:10px;background:#242933;border:1px solid var(--line-2);max-width:100%}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--gc)}
.chip em{font-style:normal;color:var(--dim);font-size:10px}
.chip button{border:0;background:none;padding:0 4px;color:var(--muted);line-height:1}
.chip button:hover{color:var(--err);background:none}
select.gadd{width:auto;padding:1px 4px;font-size:11px;color:var(--muted)}
.crow{display:grid;grid-template-columns:100px minmax(0,1fr) 22px;gap:6px;align-items:center;margin-bottom:4px}
.crow .ck{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
.custom-add{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:6px;margin-top:6px}
.empty-sel{padding:18px 14px;color:var(--text)}
.empty-sel p{margin:0 0 10px}
.meshcard{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border:1px solid var(--line-2);border-radius:7px;background:#14171c;margin-bottom:6px}
.meshcard b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meshcard span{color:var(--muted);font-size:11px}
.rng{display:grid;grid-template-columns:minmax(0,1fr) 38px;align-items:center;gap:6px}
.rng span{color:var(--muted);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.stat{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted)}
.stat b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* viewport */
#viewport{position:relative;min-width:0;min-height:0;overflow:hidden;background:#14161b}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.views{position:absolute;top:8px;right:8px;display:flex;gap:3px;background:rgba(23,26,32,.85);border:1px solid var(--line);border-radius:8px;padding:3px}
.views button{padding:3px 7px;font-size:11px;background:transparent;border-color:transparent;color:var(--muted)}
.views button:hover{color:var(--text);background:var(--panel-3)}
#status{position:absolute;left:0;right:0;bottom:0;height:25px;display:flex;align-items:center;gap:16px;padding:0 10px;background:rgba(17,19,24,.88);border-top:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden}
#status b{color:var(--text);font-weight:600}
#st-hint{flex:1;overflow:hidden;text-overflow:ellipsis}
#st-cursor,#st-count{font-variant-numeric:tabular-nums}
#empty{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(420px,86%);background:rgba(23,26,32,.92);border:1px solid var(--line-2);border-radius:12px;padding:18px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#empty h2{margin:0 0 6px;font-size:15px;font-weight:650}
#empty p{margin:0 0 12px;color:var(--muted)}
#empty .btnrow{justify-content:center;margin:0 0 10px}
#boot{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 18px;background:var(--panel);border:1px solid var(--line-2);border-radius:10px;z-index:200;text-align:center;line-height:1.6}
#boot.err{border-color:var(--err)}

/* toasts, modal, drop */
#toasts{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:300;pointer-events:none}
.toast{background:#232833;border:1px solid var(--line-2);padding:7px 13px;border-radius:7px;box-shadow:0 6px 24px rgba(0,0,0,.45);transition:opacity .25s,transform .25s;max-width:70vw}
.toast.ok{border-color:rgba(62,207,142,.6)}.toast.warn{border-color:rgba(245,196,81,.7)}.toast.err{border-color:var(--err)}
.toast.out{opacity:0;transform:translateY(6px)}
.modal-back{position:fixed;inset:0;background:rgba(5,6,8,.6);display:flex;align-items:center;justify-content:center;z-index:250}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:11px;width:min(520px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.wide{width:min(940px,95vw)}
.modal header{padding:12px 16px;font-weight:650;font-size:13.5px;border-bottom:1px solid var(--line)}
.modal .body{padding:14px 16px;overflow:auto}
.modal .body p{margin:0 0 10px}
.modal footer{padding:10px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
textarea.code{font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;height:56vh;resize:vertical;white-space:pre;tab-size:4}
.exp-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.warns{margin-bottom:10px;border-left:3px solid var(--warn);background:rgba(245,196,81,.07);padding:7px 10px;border-radius:0 6px 6px 0}
.warns div{margin:2px 0}
table.keys{border-collapse:collapse;width:100%}
table.keys td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.keys td:first-child{white-space:nowrap;color:var(--muted);width:42%}
#drop{position:fixed;inset:0;border:3px dashed var(--accent);background:rgba(255,138,31,.07);display:none;align-items:center;justify-content:center;font-size:17px;z-index:280;pointer-events:none}
#drop.on{display:flex}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5 20 19H4Z" fill="currentColor" fill-opacity=".22" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 4.5v14.5M8 11.8h8" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="4.5" r="2.2" fill="currentColor"/><circle cx="20" cy="19" r="2.2" fill="currentColor"/><circle cx="4" cy="19" r="2.2" fill="currentColor"/></svg>JBeam Builder</div>
    <div class="sep"></div>
    <button data-act="new" title="Clear nodes, beams and triangles (undoable)">New</button>
    <button data-act="open-project" title="Open a saved project (.json)">Open project…</button>
    <button data-act="save-project" title="Save project (Ctrl+S)">Save project</button>
    <div class="sep"></div>
    <button data-act="import-mesh" title="Import a reference mesh (OBJ, GLB, glTF)">Import mesh…</button>
    <button data-act="import-jbeam" title="Load nodes/beams/triangles from an existing .jbeam">Import .jbeam…</button>
    <button data-act="export" class="primary">Export .jbeam</button>
    <div class="spacer"></div>
    <button data-act="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button data-act="redo" title="Redo (Ctrl+Shift+Z / Ctrl+Y)">Redo</button>
    <button data-act="help" title="Shortcuts and tips">?</button>
  </header>

  <aside id="left">
    <div class="section">
      <h3>Tools</h3>
      <div class="modes">
        <button class="mode" data-mode="select" title="Select / edit (V)"><svg viewBox="0 0 24 24"><path d="M6 3.5 18.5 12l-5.6 1.3-2.6 5.7Z"/></svg><span>Select</span><kbd>V</kbd></button>
        <button class="mode" data-mode="node" title="Place node (N)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".45"/></svg><span>Node</span><kbd>N</kbd></button>
        <button class="mode" data-mode="beam" title="Place beam (B)"><svg viewBox="0 0 24 24"><path d="M6 18 18 6" stroke="currentColor" stroke-width="2.2"/><circle cx="6" cy="18" r="3.2"/><circle cx="18" cy="6" r="3.2"/></svg><span>Beam</span><kbd>B</kbd></button>
        <button class="mode" data-mode="tri" title="Place collision triangle (T)"><svg viewBox="0 0 24 24"><path d="M12 5.5 19 18H5Z" fill-opacity=".3" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="5.5" r="2.4"/><circle cx="19" cy="18" r="2.4"/><circle cx="5" cy="18" r="2.4"/></svg><span>Triangle</span><kbd>T</kbd></button>
      </div>
      <div id="tool-opts"></div>
    </div>
    <div class="tabs" id="otabs">
      <button class="tab" data-otab="nodes">Nodes<span class="count" id="cnt-nodes"></span></button>
      <button class="tab" data-otab="beams">Beams<span class="count" id="cnt-beams"></span></button>
      <button class="tab" data-otab="tris">Tris<span class="count" id="cnt-tris"></span></button>
      <button class="tab" data-otab="groups">Groups<span class="count" id="cnt-groups"></span></button>
    </div>
    <div class="filter"><input id="filter" placeholder="Filter by name or group…" spellcheck="false" autocomplete="off"></div>
    <div id="gnew-row" hidden><input id="gnew" placeholder="New group name, e.g. chassis" spellcheck="false" autocomplete="off"><button data-act="group-create">Add</button></div>
    <div class="list" id="outliner"></div>
  </aside>

  <main id="viewport">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <div class="views" title="Camera views (BeamNG axes)">
      <button data-act="view" data-view="front" title="Look at the front (camera on −Y)">Front</button>
      <button data-act="view" data-view="rear" title="Look at the rear (camera on +Y)">Rear</button>
      <button data-act="view" data-view="left" title="Look at the left side (camera on +X)">Left</button>
      <button data-act="view" data-view="right" title="Look at the right side (camera on −X)">Right</button>
      <button data-act="view" data-view="top" title="Top view (camera on +Z)">Top</button>
      <button data-act="view" data-view="iso" title="Three-quarter view">3D</button>
      <button data-act="frame-all" title="Frame everything">Fit</button>
    </div>
    <div id="empty" hidden>
      <h2>Start a part</h2>
      <p>Import a reference mesh to place nodes on, load an existing .jbeam, or press <kbd>N</kbd> and click to place nodes in free space.</p>
      <div class="btnrow"><button class="primary" data-act="import-mesh">Import mesh…</button><button data-act="import-jbeam">Import .jbeam…</button><button data-act="open-project">Open project…</button></div>
      <p class="small">Files can also be dragged onto the window.</p>
    </div>
    <div id="status"><span id="st-hint"></span><span id="st-cursor"></span><span id="st-count"></span></div>
  </main>

  <aside id="right">
    <div class="tabs" id="rtabs">
      <button class="tab" data-rtab="sel">Selection</button>
      <button class="tab" data-rtab="part">Part &amp; export</button>
      <button class="tab" data-rtab="scene">Mesh &amp; view</button>
    </div>
    <div class="panel-body" id="rp-sel"></div>
    <div class="panel-body" id="rp-part" hidden></div>
    <div class="panel-body" id="rp-scene" hidden></div>
  </aside>
</div>
<div id="toasts"></div>
<div id="drop">Drop a mesh (.obj .glb .gltf + .bin), a .jbeam or a project .json</div>
<div id="boot">Loading Three.js…</div>
<input type="file" id="file-mesh" accept=".obj,.glb,.gltf,.bin,.png,.jpg,.jpeg,.webp" multiple hidden>
<input type="file" id="file-jbeam" accept=".jbeam,.json" hidden>
<input type="file" id="file-project" accept=".json" hidden>
<script>
setTimeout(function () {
  if (window.__jbbReady) return;
  var b = document.getElementById('boot');
  if (b) { b.className = 'err'; b.innerHTML = 'Could not load Three.js from cdn.jsdelivr.net.<br>JBeam Builder needs an internet connection to load its 3D library.'; }
}, 15000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* ============================== helpers ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const J = v => JSON.stringify(v);
class GroupComment { constructor(groups) { this.groups = groups; } }
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v) && !(v instanceof GroupComment);
const same = (a, b) => a === b || J(a) === J(b);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r6 = v => Math.round(v * 1e6) / 1e6 + 0;
const fmtInt = n => Math.round(n).toLocaleString('en-US');
// BeamNG is Z-up (vehicles face −Y); three.js is Y-up. Proper rotation, so handedness and winding are preserved.
const toThree = p => new THREE.Vector3(p[0], p[2], -p[1]);
const fromThree = v => [r6(v.x), r6(-v.z), r6(v.y)];
const dist3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const NUM_RE = /^[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?$/;
const parseNumOrStr = s => {
  s = String(s).trim();
  if (s === '') return undefined;
  if (NUM_RE.test(s)) { const v = Number(s); if (Number.isFinite(v)) return v; }
  return s;
};
const parseLoose = s => { s = String(s).trim(); if (s === '') return undefined; try { return JSON.parse(s); } catch { return s; } };
const pairKey = (a, b) => (a < b ? a + ',' + b : b + ',' + a);
const triKey = ns => [...ns].sort((x, y) => x - y).join(',');
const safeFile = s => (String(s).trim() || 'part').replace(/[\\/:*?"<>|\s]+/g, '_');
const normGroups = g => typeof g === 'string' ? (g ? [g] : []) : Array.isArray(g) ? [...new Set(g.filter(x => typeof x === 'string' && x))] : [];
const cleanGroupName = s => String(s).replace(/[\r\n\t]+/g, ' ').trim();

function groupHue(name) { let h = 2166136261; for (let i = 0; i < name.length; i++) { h ^= name.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) % 360; }
const groupColorCache = new Map();

function normalizeModel(m) {

  if (!isObj(m)) return out;
  if (isObj(m.part)) {
    const p = m.part;
    out.part = { name: String(p.name ?? 'my_part'), slotType: String(p.slotType ?? 'main'), infoName: String(p.infoName ?? ''), authors: String(p.authors ?? ''), infoExtra: isObj(p.infoExtra) ? p.infoExtra : {} };
  }
  const idMap = new Map(), names = new Set(); let next = 1;
  const props = p => (isObj(p) ? p : {});
  for (const n of Array.isArray(m.nodes) ? m.nodes : []) {
    if (!isObj(n) || typeof n.name !== 'string' || !n.name) continue;
    let name = n.name, k = 2;

    const id = next++;
    idMap.set(n.id, id);

  }
  const link = (arr, count, target) => {
    for (const e of Array.isArray(arr) ? arr : []) {
      if (!isObj(e) || !Array.isArray(e.n) || e.n.length !== count) continue;
      const ids = e.n.map(x => idMap.get(x));
      if (ids.some(x => !x) || new Set(ids).size !== count) continue;
      target.push({ id: next++, n: ids, groups: normGroups(e.groups), props: props(e.props) });
    }

  link(m.tris, 3, out.tris);

}

    const p = t.n.map(id => nodeIndex.get(id) * 3);
    if (p.some(i => Number.isNaN(proj[i + 2]))) continue;

const raycaster = new THREE.Raycaster();

  let max = 0;

  let k = max + 1, name;

/* ================================ camera ================================ */
function frameBox(box) {
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3());
  const r = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 0.25);
  const dir = camera.position.clone().sub(controls.target).normalize();
  if (!Number.isFinite(dir.x) || dir.lengthSq() < 0.5) dir.set(1, 0.6, 1).normalize();
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.05;
  controls.target.copy(c);
  camera.position.copy(c).addScaledVector(dir, dist);
  camera.far = Math.max(1000, dist * 20);
  camera.updateProjectionMatrix();
  controls.update();
}
function nodesBox(nodes) { const b = new THREE.Box3(); for (const n of nodes) b.expandByPoint(toThree(n.pos)); return b; }
function frameAll() {
  const box = nodesBox(model.nodes);
  if (meshObject && settings.mesh.visible) box.union(new THREE.Box3().setFromObject(meshRoot));
  if (box.isEmpty()) box.set(new THREE.Vector3(-1, 0, -1), new THREE.Vector3(1, 1, 1));
  frameBox(box);
}
function frameSelection() {
  const ids = new Set([...selNodes().map(n => n.id), ...selBeams().flatMap(b => b.n), ...selTris().flatMap(t => t.n)]);
  if (!ids.size) return frameAll();
  frameBox(nodesBox([...ids].map(id => nodeById.get(id))));
}
function setView(name) {
  const dirs = { front: [0, -1, 0], rear: [0, 1, 0], left: [1, 0, 0], right: [-1, 0, 0], iso: [1.1, -1.35, 0.85] };
  // Top view: tiny offset keeps OrbitControls stable and puts the vehicle front (−Y) at the top of the screen.
  const d = name === 'top' ? new THREE.Vector3(0, 1, -1e-3).normalize() : toThree(dirs[name]).normalize();
  const dist = camera.position.distanceTo(controls.target);
  camera.position.copy(controls.target).addScaledVector(d, dist);
  controls.update();
}

/* ================================= mesh ================================= */

  meshObject.traverse(o => {
    if (!o.isMesh) return;
    o.geometry?.dispose();
    for (const key of ['origMat', 'origClone']) {
      const m = o.userData[key];
      for (const mat of Array.isArray(m) ? m : m ? [m] : []) {
        for (const v of Object.values(mat)) if (v && v.isTexture) v.dispose();
        mat.dispose();
      }

  });
  meshObject = null; meshInfo = null;
}

  if (!meshObject) return;

  clayMat.opacity = m.opacity; clayMat.transparent = transparent; clayMat.wireframe = m.wireframe; clayMat.needsUpdate = true;
  meshObject.traverse(o => {
    if (!o.isMesh) return;
    if (!m.original) { o.material = clayMat; return; }
    if (!o.userData.origClone) {
      const src = o.userData.origMat;
      o.userData.origClone = Array.isArray(src) ? src.map(x => x.clone()) : src.clone();
    }
    const mats = Array.isArray(o.userData.origClone) ? o.userData.origClone : [o.userData.origClone];
    for (const x of mats) { x.transparent = transparent; x.opacity = m.opacity; x.wireframe = m.wireframe; x.side = THREE.DoubleSide; x.needsUpdate = true; }

async function loadMeshFiles(files, { fromProject = false } = {}) {
  const main = files.find(f => /\.(glb|gltf)$/i.test(f.name)) || files.find(f => /\.obj$/i.test(f.name));
  if (!main) { toast('Choose an .obj, .glb or .gltf file (plus its .bin/textures for .gltf)', 'err'); return false; }
  let obj;
  const urls = [];
  try {
    if (/\.obj$/i.test(main.name)) {
      obj = new OBJLoader().parse(new TextDecoder().decode(main.buffer));
    } else {
      const byName = new Map(files.map(f => { const u = URL.createObjectURL(new Blob([f.buffer])); urls.push(u); return [f.name, u]; }));
      const manager = new THREE.LoadingManager();
      manager.setURLModifier(url => {
        if (/^(data|blob):/.test(url)) return url;
        const base = decodeURIComponent(url.split(/[\\/]/).pop().split('?')[0]);
        return byName.get(base) ?? url;
      });
      const gltf = await new Promise((res, rej) => new GLTFLoader(manager).parse(main.buffer, '', res, rej));
      obj = gltf.scene;
    }
  } catch (e) {
    toast(`Could not load ${main.name}: ${e?.message || e}`, 'err', 6000);
    return false;
  } finally {
    setTimeout(() => urls.forEach(u => URL.revokeObjectURL(u)), 30000);
  }
  clearMeshObject();
  meshObject = obj;
  meshAxis.add(obj);
  let tris = 0;
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.userData.origMat = o.material;
    const g = o.geometry;
    if (!g.attributes.normal) g.computeVertexNormals();
    tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
  });
  meshInfo = { name: main.name, tris };
  meshSource = { main: main.name, files: /\.obj$/i.test(main.name) ? [main] : files };
  applyMeshSettings();
  if (!fromProject) {
    frameAll();
    toast(`Loaded ${main.name} (${fmtInt(tris)} triangles)`, 'ok');
  }
  scheduleUI('scene', 'status');
  return true;
}
async function loadMeshFromFileList(fileList) {
  const files = await Promise.all(fileList.map(async f => ({ name: f.name, buffer: await f.arrayBuffer() })));
  if (await loadMeshFiles(files)) switchRTab('scene');
}

  clearMeshObject();
  meshSource = null;
  requestRender();
  scheduleUI('scene', 'status');

/* ====================== jbeam (relaxed JSON) parser ======================

   Comments of the form "// group: a, b" inside arrays become GroupComment markers,

  };

        if (d === 42) { const e = src.indexOf('*/', i + 2); if (e < 0) fail('Unterminated comment'); comments.push(src.slice(i + 2, e)); i = e + 2; continue; }

    m = WORD.exec(src);

    fail(`Unexpected character "${c}"`);
  }

    i++;

    for (;;) {
      comments = [];
      ws();
      for (const t of comments) {
        const m = GROUP_COMMENT_RE.exec(t.trim());

function doImport(parts, mode, fileName) {
  const merge = mode === 'merge';
  const nameMap = new Map(merge ? model.nodes.map(n => [n.name, n.id]) : []);
  const nodes = [], beams = [], tris = [], groups = new Set(merge ? model.groups : []);
  let reused = 0, skipped = 0, badPos = 0;
  for (const [, part] of parts) {
    readRows(part.nodes, (v, props) => {

      if (!name) return;
      if (nameMap.has(name)) { reused++; return; }
      let pos = [v.posX, v.posY, v.posZ].map(Number);
      if (pos.some(x => !Number.isFinite(x))) { badPos++; pos = pos.map(x => (Number.isFinite(x) ? x : 0)); }
      const off = props.nodeOffset;

  const link = (rows, cols, target) => readRows(rows, (v, props, cg) => {
    const ids = cols.map(c => nameMap.get(String(v[c])));
    if (ids.some(x => !x) || new Set(ids).size !== cols.length) { skipped++; return; }
    cg.forEach(x => groups.add(x));

    link(part.triangles, ['id1', 'id2', 'id3'], tris);
  }
  mutate(merge ? 'Merge ' + fileName : 'Import ' + fileName, () => {
    if (merge) {
      model.nodes.push(...nodes); model.beams.push(...beams); model.tris.push(...tris);
      model.groups = [...groups];
      return;
    }
    const [pname, part] = parts[0];
    const { name: iname, authors, ...infoRest } = isObj(part.information) ? part.information : {};
    model.part = { name: pname, slotType: typeof part.slotType === 'string' ? part.slotType : 'main', infoName: iname != null ? String(iname) : '', authors: authors != null ? String(authors) : '', infoExtra: stripMarkers(infoRest) };
    model.nodes = nodes; model.beams = beams; model.tris = tris; model.groups = [...groups];
    const extra = {};
    if (parts.length === 1) for (const [k, v] of Object.entries(part)) if (!['nodes', 'beams', 'triangles', 'information', 'slotType'].includes(k)) extra[k] = stripMarkers(v);

  if (reused) notes.push(`${reused} node${reused > 1 ? 's' : ''} reused by name`);
  if (skipped) notes.push(`${skipped} beam/triangle row${skipped > 1 ? 's' : ''} skipped (unknown nodes)`);
  if (badPos) notes.push(`${badPos} node position${badPos > 1 ? 's' : ''} were not numbers`);
  toast(`Imported ${nodes.length} nodes, ${beams.length} beams, ${tris.length} triangles${notes.length ? ' — ' + notes.join(', ') : ''}`, notes.length ? 'warn' : 'ok', notes.length ? 7000 : 3500);
}

async function handleFiles(files) {

  if (meshFiles.some(f => /\.(obj|glb|gltf)$/i.test(f.name))) await loadMeshFromFileList(meshFiles);

/* ============================ UI scheduling ============================ */
const uiDirty = new Set();

}
function flushUI() {
  uiQueued = false;
  const d = new Set(uiDirty);
  uiDirty.clear();
  if (d.has('tools')) renderTools();
  if (d.has('outliner')) renderOutliner();
  if (d.has('props')) renderProps();

}
// Re-renders a panel while keeping focus, caret and any not-yet-committed text in the focused field.
function preserveFocus(container, fn) {
  const a = document.activeElement;
  const fid = a && container.contains(a) ? a.dataset.fid : null;
  const typed = fid && a.tagName === 'INPUT' && a.value !== a.defaultValue ? a.value : null;
  let s0 = null, s1 = null;
  try { if (fid) { s0 = a.selectionStart; s1 = a.selectionEnd; } } catch { /* not a text input */ }
  const st = container.scrollTop;
  fn();
  container.scrollTop = st;
  if (!fid) return;
  const el = container.querySelector(`[data-fid="${CSS.escape(fid)}"]`);
  if (!el) return;
  if (typed !== null) el.value = typed;
  el.focus({ preventScroll: true });
  try { if (s0 != null) el.setSelectionRange(s0, s1); } catch { /* not a text input */ }
}

function renderOutliner() {
  $('#cnt-nodes').textContent = model.nodes.length;
  $('#cnt-beams').textContent = model.beams.length;
  $('#cnt-tris').textContent = model.tris.length;
  $('#cnt-groups').textContent = model.groups.length;
  $('#gnew-row').hidden = ui.otab !== 'groups';
  const list = $('#outliner'), st = list.scrollTop, f = ui.filter.trim().toLowerCase(), LIMIT = 3000;
  const match = (...s) => !f || s.some(x => String(x).toLowerCase().includes(f));
  const rows = [];
  let total = 0, empty = '';
  const item = (k, main, sub, kind, extra = '') => `<div class="item${sel.has(k) ? ' sel' : ''}" data-key="${k}"><span class="kind ${kind}"></span><span class="nm">${main}</span>${extra}<span class="sub">${sub}</span></div>`;
  if (ui.otab === 'nodes') {
    empty = 'No nodes yet. Press N and click in the viewport.';
    for (const n of model.nodes) {
      if (!match(n.name, ...n.groups)) continue;
      if (++total <= LIMIT) rows.push(item('n:' + n.id, esc(n.name), esc(n.groups.join(', ')), 'n'));
    }
  } else if (ui.otab === 'beams') {
    empty = 'No beams yet. Press B and click two nodes.';
    for (const b of model.beams) {
      const a = nodeName(b.n[0]), c = nodeName(b.n[1]);
      if (!match(a, c, ...b.groups)) continue;
      const t = b.props.beamType && b.props.beamType !== '|NORMAL' ? `<span class="badge">${esc(String(b.props.beamType).replace('|', '').slice(0, 5).toLowerCase())}</span>` : '';
      if (++total <= LIMIT) rows.push(item('b:' + b.id, `${esc(a)} – ${esc(c)}`, esc(b.groups.join(', ')), 'b', t));
    }
  } else if (ui.otab === 'tris') {
    empty = 'No triangles yet. Press T and click three nodes.';
    for (const t of model.tris) {
      const ns = t.n.map(nodeName);
      if (!match(...ns, ...t.groups)) continue;
      if (++total <= LIMIT) rows.push(item('t:' + t.id, ns.map(esc).join(' · '), esc(t.groups.join(', ')), 't'));
    }
  } else {
    empty = 'No groups yet. Type a name above and press Add.';
    const cnt = new Map(model.groups.map(g => [g, [0, 0, 0]]));
    [model.nodes, model.beams, model.tris].forEach((arr, i) => { for (const e of arr) for (const g of e.groups) cnt.get(g) && cnt.get(g)[i]++; });
    for (const g of model.groups) {
      if (!match(g)) continue;
      total++;
      const [cn, cb, ct] = cnt.get(g);
      rows.push(`<div class="gitem" data-group="${esc(g)}" title="Click to select members (Ctrl+click adds)"><span class="sw" style="background:${groupCss(g)}"></span><span class="nm">${esc(g)}</span><span class="sub">${cn}n · ${cb}b · ${ct}t</span><span class="gbtns"><button class="icon" data-gact="assign" title="Add the selection to this group">+</button><button class="icon" data-gact="unassign" title="Remove the selection from this group">−</button><button class="icon" data-gact="rename" title="Rename">✎</button><button class="icon" data-gact="delete" title="Delete the group (members are kept)">×</button></span></div>`);
    }
  }
  list.innerHTML = rows.join('') + (total > LIMIT ? `<div class="more">${fmtInt(total - LIMIT)} more — use the filter</div>` : '') + (!total ? `<div class="empty">${f ? 'Nothing matches the filter.' : empty}</div>` : '');
  list.scrollTop = st;
  if (scrollOutlinerToSel) {

  }
}

const mouse = { x: 0, y: 0, in: false };
let down = null, hoverQueued = false;
const localXY = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

function setMode(m) {

function cancelPending() {

function describeCoords(p) { const [x, y, z] = fromThree(p); return `x ${x.toFixed(3)}  y ${y.toFixed(3)}  z ${z.toFixed(3)}`; }

// Pointer-down on the viewport is seen here first (capture phase) so Shift/Ctrl+drag can become a box
// selection before OrbitControls or the gizmo react to it.
vpEl.addEventListener('pointerdown', e => {
  if (e.target !== canvas) return;
  const { x, y } = localXY(e);
  if (e.button === 0 && ui.mode === 'select' && (e.shiftKey || e.ctrlKey || e.metaKey)) {
    e.stopPropagation();
    canvas.setPointerCapture(e.pointerId);
    down = { x, y, button: 0, box: true, remove: !e.shiftKey };
    return;
  }
  down = { x, y, button: e.button, box: false };
}, true);

vpEl.addEventListener('pointermove', e => {
  const { x, y } = localXY(e);
  mouse.x = x; mouse.y = y;
  if (down?.box) { boxRect = [down.x, down.y, x, y]; requestRender(); return; }
  mouse.in = e.target === canvas;
  if (e.buttons) return;
  scheduleHover();
});
vpEl.addEventListener('pointerleave', () => { mouse.in = false; scheduleHover(); });

vpEl.addEventListener('pointerup', e => {
  if (!down) return;
  const d = down;
  down = null;
  const { x, y } = localXY(e);
  const moved = Math.hypot(x - d.x, y - d.y) > 4;
  const wasGizmo = gizmoPressed;
  gizmoPressed = false;
  if (d.box) {
    boxRect = null;
    if (moved) boxSelect(d, x, y); else clickSelect(x, y, true);
    requestRender();
    return;
  }
  if (moved || wasGizmo) return;
  if (d.button === 2) { cancelPending(); return; }
  if (d.button !== 0) return;
  if (ui.mode === 'select') clickSelect(x, y, false);
  else if (ui.mode === 'node') clickNode(x, y, e.ctrlKey || e.metaKey);
  else clickLink(x, y);
});

function clickSelect(x, y, toggle) {
  const hit = pickAt(x, y);
  if (!toggle) sel.clear();
  if (hit) {
    const k = keyOf(hit.type, hit.el.id);
    if (toggle && sel.has(k)) sel.delete(k); else sel.add(k);
  }
  selectionChanged(true);
}
function boxSelect(d, x, y) {
  ensureProj();
  const x0 = Math.min(d.x, x), x1 = Math.max(d.x, x), y0 = Math.min(d.y, y), y1 = Math.max(d.y, y);
  let count = 0;
  model.nodes.forEach((n, i) => {
    if (Number.isNaN(proj[i * 3 + 2])) return;
    const px = proj[i * 3], py = proj[i * 3 + 1];
    if (px < x0 || px > x1 || py < y0 || py > y1) return;
    count++;
    if (d.remove) sel.delete('n:' + n.id); else sel.add('n:' + n.id);
  });

  if (count) toast(`${d.remove ? 'Removed' : 'Added'} ${count} node${count > 1 ? 's' : ''}`);
}
function clickNode(x, y, viewPlane) {
  const existing = pickNode(x, y);
  if (existing) { setSelection(['n:' + existing.id]); return; }
  const hit = viewPlane ? null : hitMesh(x, y);
  const p = hit ? hit.point : hitViewPlane(x, y);
  if (!p) return;
  addNode(fromThree(p));
  scheduleHover();
}
function clickLink(x, y) {
  const n = pickNode(x, y);

  const i = ui.pending.indexOf(n.id);
  if (i >= 0) ui.pending.splice(i, 1);
  else if (ui.mode === 'beam') {
    if (!ui.pending.length) ui.pending = [n.id];
    else {
      const b = addBeam(ui.pending[0], n.id);
      ui.pending = ui.chain ? [n.id] : [];
      if (b) setSelection(['b:' + b.id], false);
    }
  } else {
    ui.pending.push(n.id);
    if (ui.pending.length === 3) {
      const t = addTri(ui.pending);
      ui.pending = [];
      if (t) setSelection(['t:' + t.id], false);

function scheduleHover() { if (!hoverQueued) { hoverQueued = true; requestAnimationFrame(computeHover); } }
function computeHover() {
  hoverQueued = false;

    ghost.visible = false;
    if (!mouse.in) { pendLine.visible = false; st.textContent = ''; setHover(null); }
    requestRender();
    return;
  }
  const { x, y } = mouse;
  let hk = null, cursor = null, info = '';
  if (ui.mode === 'select') {
    const h = pickAt(x, y);
    if (h) hk = keyOf(h.type, h.el.id);
  } else {
    const n = pickNode(x, y);
    if (n) { hk = 'n:' + n.id; cursor = toThree(n.pos); }
  }
  ghost.visible = false;
  if (ui.mode === 'node' && !hk) {
    const hit = hitMesh(x, y);
    cursor = hit ? hit.point : hitViewPlane(x, y);
    if (cursor) {
      ghost.position.copy(cursor);
      ghost.visible = true;
      ghostMat.color.set(hit ? 0xff8a1f : 0x9aa3b5);

    if (!cursor) cursor = hitViewPlane(x, y);
    const ps = ui.pending.map(id => nodeP[nodeIndex.get(id)]);
    const segs = [];
    if (cursor) {
      if (ps.length === 1) segs.push([ps[0], cursor]);
      else segs.push([ps[0], ps[1]], [ps[1], cursor], [cursor, ps[0]]);
    }
    setPendingSegments(segs);
  } else pendLine.visible = false;
  if (hk) {
    const el = getByKey(hk);
    if (hk[0] === 'n') info = `${el.name} · ${el.pos.map(v => v.toFixed(3)).join(', ')}`;
    else if (hk[0] === 'b') info = `${nodeName(el.n[0])}–${nodeName(el.n[1])} · ${beamLen(el).toFixed(3)} m`;
    else info = el.n.map(nodeName).join(' · ');

  setHover(hk);

}

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 's') { e.preventDefault(); saveProject(); return; }
  if (modalOpen) return;
  const t = e.target;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable) {
    if (e.key === 'Escape') t.blur();
    return;
  }
  if (mod && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'a') { e.preventDefault(); selectAll(); return; }
  if (mod || e.altKey) return;
  switch (k) {
    case 'v': case '1': setMode('select'); break;
    case 'n': case '2': setMode('node'); break;
    case 'b': case '3': setMode('beam'); break;
    case 't': case '4': setMode('tri'); break;
    case 'escape': if (!cancelPending() && sel.size) setSelection([], false); break;
    case 'delete': case 'backspace': deleteSelection(); break;
    case 'f': frameSelection(); break;
    case '?': showHelp(); break;
    default: return;
  }
  e.preventDefault();
});

window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#drop').classList.add('on'); });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').classList.remove('on'); });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('#drop').classList.remove('on');
  handleFiles([...e.dataTransfer.files]);
});
window.addEventListener('beforeunload', e => {
  if (dirty && (model.nodes.length || model.beams.length)) { e.preventDefault(); e.returnValue = ''; }
});

/* ================================= start ================================= */
switchRTab('sel');
switchOTab('nodes');
modelChanged();
scheduleUI('scene');
resize();
$('#boot').remove();
window.__jbbReady = true;
</script>
</body>
</html>
